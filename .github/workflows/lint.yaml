name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: awesome-lint
        run: npx --yes awesome-lint@2.3.0 readme.md

  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          jobSummary: true
          lycheeVersion: v0.24.2
          args: --config lychee.toml --verbose --no-progress readme.md archived.md
